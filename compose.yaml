name: cp-assistant

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: cp_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate .env.production first}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cp_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB"]
    logging: *logging

  web:
    image: ${APP_IMAGE:-cp-assistant-web:local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      DJANGO_SETTINGS_MODULE: config.production
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate .env.production first}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: https://api.groq.com/openai/v1/chat/completions
      AI_MODEL_NAME: ${AI_MODEL_NAME:-openai/gpt-oss-120b}
      EXTENSION_ALLOWED_IDS: ${EXTENSION_ALLOWED_IDS:-}
      EXTENSION_ALLOWED_ORIGIN: ${EXTENSION_ALLOWED_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, database]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':os.environ['DOMAIN']}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 40s
    mem_limit: 2g
    cpus: 1.0
    logging: *logging

  nginx:
    image: nginx:stable
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
    volumes:
      - ${NGINX_TEMPLATE:-./deploy/nginx/https.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-./deploy/acme}:/var/www/certbot:ro
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

networks:
  frontend:
  database:
    internal: true

volumes:
  postgres_data:
