<div class="code-list notranslate" translate="no" role="region" tabindex="0" aria-label="{{ label }}">{% for line in lines %}<div class="code-line{% if line.highlight %} code-line-issue{% endif %}" id="{{ prefix }}-{{ line.number }}"><span class="line-number" aria-hidden="true">{{ line.number }}</span><code>{{ line.text }}{% if not line.text %} {% endif %}</code></div>{% endfor %}</div>
